<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>הר סוף בוטיק — מערכת שיווק</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 140% at 50% 0%,#221D15,#0F0D0A);font-family:"Segoe UI","Heebo",Arial,sans-serif}
  .box{background:#1C1915;border:1px solid #8F7440;border-radius:18px;padding:40px 36px;max-width:390px;width:90%;
    text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .mark{font-size:26px;letter-spacing:.18em;color:#E2C68C;font-weight:300;margin-bottom:2px}
  .mark b{font-weight:700}
  h1{font-size:14px;margin:0 0 4px;color:#A2957D;font-weight:400;letter-spacing:.12em}
  p{color:#6E6350;font-size:12.5px;margin:0 0 22px}
  input{width:100%;box-sizing:border-box;border:1.5px solid #37311F;background:#12100C;color:#EFE8DA;
    border-radius:12px;padding:12px 14px;font-size:16px;text-align:center;font-family:inherit;direction:ltr}
  input:focus{outline:none;border-color:#C9A566;box-shadow:0 0 0 3px rgba(201,165,102,.15)}
  button{width:100%;margin-top:12px;background:linear-gradient(180deg,#C9A566,#8F7440);color:#17130C;border:none;
    border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button:disabled{filter:grayscale(.5);cursor:wait}
  #err{color:#D96B67;font-size:13px;margin-top:10px;min-height:18px}
  #err.ok{color:#C9A566}
  .foot{margin-top:16px;font-size:11px;color:#6E6350}
</style>
</head>
<body>
<div class="box">
  <div class="mark">הַר סוּף <b>BOUTIQUE</b></div>
  <h1>אילת · מערכת שיווק וניהול</h1>
  <p>אדני ארץ — שם שיכון ויזמות · גישה מורשית בלבד</p>
  <form id="f">
    <input type="password" id="pw" placeholder="סיסמת כניסה" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">כניסה למערכת</button>
  </form>
  <div id="err"></div>
  <div class="foot">התוכן מוצפן (AES-256) · ההרשאה נקבעת לפי הסיסמה</div>
</div>
<script>
/* ===== אזור אישי לרוכש (#portal=) — ללא סיסמה, ללא נתוני מחירים ===== */
(function(){
 if(!location.hash.startsWith("#portal="))return;
 let f={};try{f=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(8)))))}catch(e){return}
 const EX=["היתר ותנאים","התארגנות באתר","חפירה ודיפון","ביסוס","שלד","גמרים ומערכות","פיתוח","טופס 4","מסירות"];
 document.addEventListener("DOMContentLoaded",()=>{
  document.body.style.cssText="margin:0;font-family:Segoe UI,Arial;background:#FDFBF6";
  document.body.innerHTML=
   '<div style="max-width:760px;margin:0 auto;padding:24px 16px 60px">'+
   '<div style="text-align:center;color:#8F7440;letter-spacing:.15em;font-size:24px;font-weight:300">הַר סוּף <b>BOUTIQUE</b></div>'+
   '<div style="text-align:center;color:#6E6350;font-size:12px;margin-bottom:22px">אדני ארץ — שם שיכון ויזמות · האזור האישי שלך</div>'+
   '<div style="background:linear-gradient(135deg,#221D15,#3A2F1D);border-radius:16px;padding:26px 22px;color:#EFE8DA;margin-bottom:16px">'+
   '<div style="font-size:22px;font-weight:600;color:#E2C68C">שלום '+(f.n||"רוכש יקר")+', ברוכים הבאים הביתה 🏖️</div>'+
   '<p style="font-size:14px;line-height:1.8;color:#CBBFA6;margin:10px 0 0">אנו באדני ארץ שמחים ונרגשים שבחרתם את ביתכם החדש בפרויקט הר סוף בוטיק — רובע המגורים החדש של אילת. מהרגע הזה אנחנו איתכם בכל צעד בדרך: מעקב אחר התקדמות הבנייה, מסמכים, וכל שאלה — הכול כאן, במקום אחד שנבנה בשבילכם.</p></div>'+
   '<div style="background:#fff;border:1px solid #E4DED2;border-radius:14px;padding:18px 20px;margin-bottom:16px">'+
   '<div style="font-size:13px;color:#8F7440;font-weight:700;letter-spacing:.06em;margin-bottom:8px">הדירה שלך</div>'+
   '<div style="font-size:19px;font-weight:600;color:#241F15">בניין '+(f.b||"")+' · דירה '+(f.a||"")+'</div>'+
   '<div style="font-size:14px;color:#6E6350;margin-top:3px">'+(f.t||"")+' · '+(f.r||"")+' חדרים · קומה '+(f.f||"")+' · מגרש '+(f.g||"")+'</div></div>'+
   '<div style="background:#fff;border:1px solid #E4DED2;border-radius:14px;padding:18px 20px;margin-bottom:16px" id="planbox">'+
   '<div style="font-size:13px;color:#8F7440;font-weight:700;letter-spacing:.06em;margin-bottom:10px">תוכנית הדירה שלך</div>'+
   '<img id="planimg" style="width:100%;border-radius:10px;border:1px solid #E4DED2" alt="תוכנית הדירה"></div>'+
   '<div style="background:#fff;border:1px solid #E4DED2;border-radius:14px;padding:18px 20px;margin-bottom:16px">'+
   '<div style="font-size:13px;color:#8F7440;font-weight:700;letter-spacing:.06em;margin-bottom:12px">התקדמות הבנייה</div>'+
   '<div id="exbar" style="background:#F0EADC;border-radius:999px;height:14px;overflow:hidden;margin-bottom:10px"><div id="exfill" style="height:100%;width:0%;background:linear-gradient(90deg,#8F7440,#C9A566);border-radius:999px;transition:width 1s"></div></div>'+
   '<div id="exsteps" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
   '<div id="exnote" style="font-size:13px;color:#6E6350;margin-top:10px"></div>'+
   '<div id="exupd" style="margin-top:8px"></div></div>'+
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">'+
   '<a href="https://wa.me/97226590700?text='+encodeURIComponent("שלום, אני "+(f.n||"")+" — רוכש/ת בבניין "+(f.b||"")+" דירה "+(f.a||"")+" בהר סוף בוטיק. ")+'" style="text-decoration:none;background:linear-gradient(180deg,#C9A566,#8F7440);color:#17130C;border-radius:12px;padding:15px 10px;text-align:center;font-weight:700;font-size:14px">💬 צ׳אט עם החברה</a>'+
   '<a href="mailto:Office@adnei-eretz.com?subject='+encodeURIComponent("פנייה לעו\"ד החברה — "+(f.n||"")+" בניין "+(f.b||"")+" דירה "+(f.a||""))+'" style="text-decoration:none;background:#fff;border:1.5px solid #8F7440;color:#8F7440;border-radius:12px;padding:15px 10px;text-align:center;font-weight:700;font-size:14px">⚖️ פנייה לעו״ד החברה</a>'+
   '<a href="mailto:Office@adnei-eretz.com?subject='+encodeURIComponent("מסמכים — "+(f.n||"")+" בניין "+(f.b||"")+" דירה "+(f.a||""))+'&body='+encodeURIComponent("שלום, מצורפים מסמכי ההרשמה/החוזה שלי. "+(f.n||""))+'" style="grid-column:1/-1;text-decoration:none;background:#fff;border:1.5px solid #B9AE97;color:#6E6350;border-radius:12px;padding:15px 10px;text-align:center;font-weight:700;font-size:14px">📎 שליחת מסמכי הרשמה וחוזה (צרפו קבצים למייל שנפתח)</a></div>'+
   '<div style="text-align:center;font-size:12px;color:#9B9080">אדני ארץ — שם שיכון ויזמות בע״מ · 02.659.0700 · Office@adnei-eretz.com</div></div>';
  const pi=document.getElementById("planimg");
  pi.onerror=function(){if(f.k&&!pi.retry){pi.retry=1;pi.src="plans/T"+f.k+".jpg"}else document.getElementById("planbox").style.display="none"};
  pi.src="plans/"+(f.u||"")+".jpg";
  fetch("p.json?v="+Date.now().toString(36),{cache:"no-store"}).then(r=>r.json()).then(p=>{
   const idx=p.exec||0;document.getElementById("exfill").style.width=Math.round((idx+1)/EX.length*100)+"%";
   document.getElementById("exsteps").innerHTML=EX.map((s,i)=>'<span style="font-size:11.5px;padding:4px 10px;border-radius:999px;'+(i<idx?"background:#F0EADC;color:#8F7440":i===idx?"background:#C9A566;color:#17130C;font-weight:700":"background:#F7F4EE;color:#B9AE97")+'">'+s+'</span>').join("");
   document.getElementById("exnote").textContent=p.note?("עדכון אחרון: "+p.note):"";
   if(p.updates&&p.updates.length)document.getElementById("exupd").innerHTML=p.updates.map(u=>'<div style="font-size:12.5px;color:#6E6350;border-right:2px solid #C9A566;padding-right:8px;margin-top:6px"><b>'+u.d+'</b> — '+u.t+'</div>').join("");
  }).catch(()=>{});
 });
})();
/* ===== מצב חתימה ללקוח (#sign=) — ללא סיסמה, מציג את הטופס בלבד ===== */
(function(){
 if(!location.hash.startsWith("#sign="))return;
 let f={};try{f=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(6)))))}catch(e){return}
 const v=x=>x||"________";
 const paras=[["c","בס\"ד"],["r","שם הנרשם: "+v(f.name)+"    תאריך: "+v(f.date)],
  ["r","לכבוד: שם שיכון ויזמות בע\"מ, ירושלים    א.ג.נ.,"],
  ["t","הנדון: הצעה/בקשה לרכישת דירה בפרויקט \"הר-סוף\" בשיפולי ההר, אילת"],
  ["n","1. אנו הח\"מ מבקשים לרכוש את הדירה: גוש 40232 חלקה 20-22, תכנית 602-0453795, בניין "+v(f.bldg)+", דירה מס' "+v(f.apt)+" (להלן: \"הדירה\")."],
  ["n","2. הדירה בת "+v(f.rooms)+" חדרים, בקומה "+v(f.floor)+", בהתאם לתוכניות הראשוניות והמפרט שהוצגו בפנינו. ידוע לנו כי התכניות אינן סופיות וכפופות לשינויים ככל שיבוצעו ע\"י החברה."],
  ["n","3. אנו מציעים לשלם תמורת הדירה סך "+v(f.price)+" ₪ (במילים: "+v(f.words)+" ש\"ח). התמורה תוצמד למדד תשומות הבניה ממועד החתימה, בשיעורים הקבועים בחוק המכר, וכוללת עלויות ערבויות בנקאיות."],
  ["n","3.1 תנאי תשלום: א. "+v(f.p1s)+" ₪ ("+v(f.p1p)+"%) במועד חתימת הסכם המכר. ב. "+v(f.p2s)+" ₪ ("+v(f.p2p)+"%) בהלוואת קבלן / תשלומים לינאריים. ג. יתרה "+v(f.p3s)+" ₪ ("+v(f.p3p)+"%) עד 30 יום לפני המסירה, כתנאי למסירת החזקה."],
  ["n","4. לדירה תוצמד חניה מס' "+v(f.park)+" ומחסן בשטח כ-"+v(f.stor)+" מ\"ר ברוטו."],
  ["n","5. נתקשר בהסכם מכר ע\"פ הנוסח שקיבלנו העתק ממנו."],
  ["n","6. להוכחת רצינות אנו מפקידים דמי רצינות בסך 30,000 ₪ לפקודת שם שיכון ויזמות בע\"מ, ומתחייבים לחתום על חוזה המכר בתוך 14 ימים מיום שנוזמן."],
  ["n","7. אם לא נחתום בתוך 14 ימים מהזימון (ולכל המאוחר 30 יום מחתימה זו) — אנו מסכימים לחילוט 5,000 ₪ מהפיקדון כפיצוי מוסכם, ולהצעת הדירה לאחרים."],
  ["n","8. בנוסף לתמורה נשלם: מס רכישה (אם יחול); שכ\"ט עו\"ד 5,917 ₪ בחתימת החוזה; אגרות רישום; חיבורי מונים; השתתפות 800 ₪ לחדר עבור תשריטי צו בית משותף (בגמר חשבון טרם מסירה)."],
  ["n","9. בדקנו את הפרויקט, המגרש וכל הנתונים, וניתנה לנו אפשרות להתייעץ עם יועצים מטעמנו — לא תהיה לנו כל טענה בקשר לכך."],
  ["n","10. לחברה שיקול דעת בלעדי למכור או לסרב. מסמך זה אינו הסכם מכר ואינו מחייב את החברה למכור; אולם ממועד חתימתו החברה לא תשווק את הדירה לאחרים עד למתן תשובה למציע. אם הבקשה לא תאושר — יוחזר הפיקדון ולא תהיה לנו טענה."],
  ["n","הערות: "+(f.notes||"—")],
  ["r","ולראיה באנו על החתום, היום "+v(f.date)+":"],
  ["r","פרטי המציע: "+v(f.buyer1)+"   ת.ז: "+v(f.tz1)],
  ["r","שם המציעה: "+v(f.buyer2)+"   ת.ז: "+v(f.tz2)],
  ["r","כתובת: "+v(f.addr)+"   דוא\"ל: "+v(f.email)],
  ["r","טלפון בית: "+v(f.phoneH)+"   נייד: "+v(f.phoneM)]];
 document.addEventListener("DOMContentLoaded",()=>{
  document.body.innerHTML=`<div style="max-width:760px;margin:0 auto;padding:20px 14px 60px;background:#FDFBF6;min-height:100vh;box-sizing:border-box">
   <div style="text-align:center;color:#8F7440;letter-spacing:.15em;font-size:22px;font-weight:300">הַר סוּף <b>BOUTIQUE</b></div>
   <div style="text-align:center;color:#6E6350;font-size:12px;margin-bottom:16px">אדני ארץ — שם שיכון ויזמות בע"מ · טופס הרשמה לחתימה</div>
   ${paras.map(p=>`<p style="${p[0]==="c"?"text-align:center;font-weight:600":p[0]==="t"?"text-align:center;font-weight:700;text-decoration:underline":"text-align:right"};font-size:13.5px;line-height:1.7;margin:8px 0;color:#241F15">${p[1]}</p>`).join("")}
   <div style="margin-top:18px"><b style="font-size:14px;color:#241F15">חתימה (חתום עם האצבע בתוך המסגרת):</b>
    <canvas id="cs" style="width:100%;height:170px;background:#fff;border:2px dashed #8F7440;border-radius:10px;touch-action:none;margin-top:8px"></canvas>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
     <button id="csend" style="flex:2;background:linear-gradient(180deg,#C9A566,#8F7440);color:#17130C;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;font-family:inherit">✓ סיים וחתום — שלח בחזרה</button>
     <button id="cclr" style="flex:1;background:none;border:1px solid #B9AE97;border-radius:10px;padding:14px;font-size:14px;color:#6E6350;font-family:inherit">נקה</button></div>
    <p id="cmsg" style="font-size:12.5px;color:#6E6350;text-align:center;margin-top:10px"></p></div></div>`;
  const c=document.getElementById("cs");c.width=c.offsetWidth*2;c.height=340;
  const x=c.getContext("2d");x.scale(2,2);x.lineWidth=2.2;x.lineCap="round";x.strokeStyle="#1A2B6D";
  let draw=false,px=0,py=0,dirty=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]};
  c.addEventListener("pointerdown",e=>{e.preventDefault();draw=true;[px,py]=pos(e)});
  c.addEventListener("pointermove",e=>{if(!draw)return;e.preventDefault();const[nx,ny]=pos(e);
   x.beginPath();x.moveTo(px,py);x.lineTo(nx,ny);x.stroke();px=nx;py=ny;dirty=true});
  window.addEventListener("pointerup",()=>draw=false);
  document.getElementById("cclr").onclick=()=>{x.clearRect(0,0,c.width,c.height);dirty=false};
  document.getElementById("csend").onclick=async()=>{
   const m=document.getElementById("cmsg");
   if(!dirty){m.textContent="נא לחתום בתוך המסגרת לפני השליחה";return}
   const W=1000,pad=40,lh=30,cv=document.createElement("canvas"),ctx=cv.getContext("2d");
   ctx.font="19px Segoe UI, Arial";
   const wrap=t=>{const ws=t.split(" ");const ls=[];let cur="";ws.forEach(w=>{
    if(ctx.measureText(cur+" "+w).width>W-pad*2&&cur){ls.push(cur);cur=w}else cur=cur?cur+" "+w:w});if(cur)ls.push(cur);return ls};
   let all=[];paras.forEach(p=>{wrap(p[1]).forEach(l=>all.push([p[0],l]));all.push(["s",""])});
   cv.width=W;cv.height=all.length*lh+340;
   ctx.fillStyle="#fff";ctx.fillRect(0,0,W,cv.height);ctx.fillStyle="#1A160F";ctx.direction="rtl";ctx.textAlign="right";
   ctx.font="bold 24px Segoe UI, Arial";ctx.fillText("אדני ארץ — הר סוף בוטיק, אילת · טופס הרשמה חתום",W-pad,50);
   ctx.font="19px Segoe UI, Arial";let y=100;
   all.forEach(l=>{if(l[0]==="s"){y+=10;return}
    if(l[0]==="c"||l[0]==="t"){ctx.font="bold 19px Segoe UI, Arial";ctx.textAlign="center";ctx.fillText(l[1],W/2,y);ctx.textAlign="right";ctx.font="19px Segoe UI, Arial"}
    else ctx.fillText(l[1],W-pad,y);y+=lh});
   ctx.fillText("חתימה:",W-pad,y+30);
   const sim=new Image();sim.onload=async()=>{ctx.drawImage(sim,W-pad-380,y+45,340,150);
    ctx.strokeStyle="#999";ctx.strokeRect(W-pad-380,y+45,340,150);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));
    const file=new File([blob],"טופס-הרשמה-חתום.jpg",{type:"image/jpeg"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
     try{await navigator.share({files:[file],title:"טופס הרשמה חתום — הר סוף בוטיק"});
      m.textContent="✓ נשלח! תודה — נציג המכירות יקבל את הטופס החתום";return}catch(e){}}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="טופס-הרשמה-חתום.jpg";a.click();
    m.innerHTML="✓ הטופס החתום ירד למכשיר — נא לשלוח אותו בוואטסאפ לנציג המכירות";
   };sim.src=c.toDataURL("image/png")};
 });
})();
const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryDecrypt(blob,pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2a(blob.salt),iterations:150000,hash:"SHA-256"},km,256);
  const key=await crypto.subtle.importKey("raw",bits,{name:"AES-CBC"},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:b2a(blob.iv)},key,b2a(blob.ct));
  return new TextDecoder().decode(plain);
}
const cache={};
async function getBlob(name){
  if(cache[name])return cache[name];
  const r=await fetch(name+".json?v="+Date.now().toString(36).slice(0,6),{cache:"no-store"});
  if(!r.ok)throw new Error("fetch "+name);
  cache[name]=await r.json();return cache[name];
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err"),btn=document.getElementById("btn");
  const pw=document.getElementById("pw").value.trim();
  if(!pw)return;
  btn.disabled=true;err.className="ok";err.textContent="טוען ומפענח…";
  for(const name of["a","m"]){
    try{
      const html=await tryDecrypt(await getBlob(name),pw);
      document.open();document.write(html);document.close();return;
    }catch(ex){}
  }
  err.className="";err.textContent="סיסמה שגויה — נסה שוב";btn.disabled=false;
});
</script>
</body>
</html>
